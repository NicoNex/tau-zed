id = "tau"
name = "Tau"
version = "0.0.14"
schema_version = 1
authors = ["Nicolò Santamaria <nicolo.santamaria@proton.me>"]
description = "Tau language support (LSP via tau-lsp)"

# The grammar Zed builds for this extension: github.com/NicoNex/tree-sitter-tau
# at this exact commit. Bumping the grammar means pushing it there and putting
# the new commit here, see UPDATING.md.
[grammars.tau]
repository = "https://github.com/NicoNex/tree-sitter-tau"
rev = "c5b11501ee48f0716b858c7f928b2aca8e3b66d9"

# Wire the LSP to the language "Tau" (defined in languages/tau/config.toml)
[language_servers."tau-lsp"]
name = "Tau LSP"
languages = ["Tau"]
